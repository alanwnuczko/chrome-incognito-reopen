name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip extension
        run: zip -r chrome-incognito-reopen.zip manifest.json background.js

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: chrome-incognito-reopen.zip